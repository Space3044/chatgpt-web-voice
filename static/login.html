<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · Voice Gateway</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2310a37f'/%3E%3Cpath d='M16 34h8l4-14 8 27 5-18h7' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var key = 'chatgpt_web_voice_theme_v1';
        var theme = localStorage.getItem(key);
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --ink: #111113;
      --muted: #6b6b73;
      --line: #ebebef;
      --green: #10a37f;
      --green-dark: #0d8c6d;
      --coral: #e11d48;
      --input-bg: #ffffff;
      --input-focus-bg: #ffffff;
      --label: #3f3f46;
      --note-border: #f0d9a8;
      --note-bg: #fff9eb;
      --note-color: #8a6419;
      --chip-bg: #ffffff;
      --chip-border: #ebebef;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 16px 40px rgba(16, 24, 40, .08);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f0f10;
      --surface: #161618;
      --ink: #f4f4f5;
      --muted: #a1a1aa;
      --line: #2a2a2e;
      --green-dark: #35c89f;
      --coral: #fb7185;
      --input-bg: #1c1c1f;
      --input-focus-bg: #1c1c1f;
      --label: #d4d4d8;
      --note-border: #5a4a28;
      --note-bg: #2a2416;
      --note-color: #e0c07a;
      --chip-bg: #1c1c1f;
      --chip-border: #2a2a2e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 48px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .page-toggles {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: inline-flex;
      gap: 8px;
    }
    .page-toggles button {
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--ink);
      border-radius: 9px;
      padding: 8px 12px;
      font: 600 12px/1 "Inter", "Segoe UI", sans-serif;
      cursor: pointer;
      margin: 0;
      width: auto;
      box-shadow: none;
      transform: none;
    }
    .page-toggles button:hover { filter: none; background: var(--line); transform: none; }
    .shell {
      width: min(420px, 100%);
      padding: 36px 32px 32px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--green); color: #fff;
      font: 800 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .brand-title {
      font-size: 15px; font-weight: 700; letter-spacing: -.02em;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -.03em;
      font-weight: 700;
    }
    label {
      display: block;
      margin-top: 14px;
      color: var(--label);
      font-size: 13px;
      font-weight: 600;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      margin-top: 7px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: var(--input-bg);
      color: var(--ink);
      font: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--green);
      background: var(--input-focus-bg);
      box-shadow: 0 0 0 3px rgba(16, 163, 127, .16);
    }
    .remember-row {
      display: flex;
      align-items: center;
      margin-top: 16px;
    }
    .remember-option {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--label);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .remember-option input[type="checkbox"] {
      appearance: none;
      width: 17px; height: 17px; flex: 0 0 17px;
      margin: 0; padding: 0;
      border: 1px solid var(--line); border-radius: 5px;
      background: var(--input-bg); cursor: pointer;
    }
    .remember-option input[type="checkbox"]:checked {
      border-color: var(--green); background: var(--green);
    }
    .remember-option input[type="checkbox"]:checked::after {
      content: ""; display: block; width: 5px; height: 9px;
      margin: 1px 0 0 5px; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    button[type="submit"] {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: var(--green);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      box-shadow: none;
      transition: background .15s ease, opacity .15s ease;
    }
    button[type="submit"]:hover { background: var(--green-dark); transform: none; }
    button[type="submit"]:disabled { cursor: wait; opacity: .65; }
    .message {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--coral);
      font-size: 13px;
      line-height: 1.5;
    }
    .connection-note {
      display: none;
      margin: 16px 0 0;
      padding: 10px 12px;
      border: 1px solid var(--note-border);
      border-radius: 10px;
      background: var(--note-bg);
      color: var(--note-color);
      font-size: 12px;
      line-height: 1.5;
    }
    .connection-note.show { display: block; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .shell { padding: 28px 20px 22px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="page-toggles">
    <button type="button" id="btnUiLocale" title="语言" aria-label="语言">中文</button>
    <button type="button" id="btnUiTheme" title="主题" aria-label="主题">浅色</button>
  </div>
  <main class="shell">
    <div class="brand-row">
      <span class="brand-mark">V</span>
      <span class="brand-title">Voice Gateway</span>
    </div>
    <h1 id="loginHeading">登录</h1>
    <form id="loginForm" novalidate>
      <label for="username" id="usernameLabel">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />

      <label for="password" id="passwordLabel">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div class="remember-row">
        <label class="remember-option" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          <span id="rememberLabel">记住登录状态</span>
        </label>
      </div>

      <button id="loginButton" type="submit">登录</button>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>
    <p id="connectionNote" class="connection-note">当前连接未加密。局域网登录请启用 HTTPS。</p>
  </main>

  <script>
    (function () {
      'use strict';
      var form = document.getElementById('loginForm');
      var button = document.getElementById('loginButton');
      var message = document.getElementById('message');
      var connectionNote = document.getElementById('connectionNote');
      var remember = document.getElementById('remember');
      var rememberLabel = document.getElementById('rememberLabel');
      var themeKey = 'chatgpt_web_voice_theme_v1';
      var localeKey = 'chatgpt_web_voice_ui_locale_v1';
      var theme = 'light';
      var locale = 'zh';
      var btnUiLocale = document.getElementById('btnUiLocale');
      var btnUiTheme = document.getElementById('btnUiTheme');

      function updateToggleButtons() {
        if (btnUiLocale) {
          btnUiLocale.textContent = locale === 'en' ? 'EN' : '中文';
          btnUiLocale.setAttribute('title', locale === 'en' ? 'Language' : '语言');
          btnUiLocale.setAttribute('aria-label', locale === 'en' ? 'Language' : '语言');
        }
        if (btnUiTheme) {
          btnUiTheme.textContent = theme === 'dark'
            ? (locale === 'en' ? 'Dark' : '深色')
            : (locale === 'en' ? 'Light' : '浅色');
          btnUiTheme.setAttribute('title', locale === 'en' ? 'Theme' : '主题');
          btnUiTheme.setAttribute('aria-label', locale === 'en' ? 'Theme' : '主题');
        }
        var heading = document.getElementById('loginHeading');
        var usernameLabel = document.getElementById('usernameLabel');
        var passwordLabel = document.getElementById('passwordLabel');
        if (heading) heading.textContent = locale === 'en' ? 'Sign in' : '登录';
        if (usernameLabel) usernameLabel.textContent = locale === 'en' ? 'Username' : '用户名';
        if (passwordLabel) passwordLabel.textContent = locale === 'en' ? 'Password' : '密码';
        if (rememberLabel) rememberLabel.textContent = locale === 'en' ? 'Remember me' : '记住登录状态';
        if (button && !button.disabled) button.textContent = locale === 'en' ? 'Sign in' : '登录';
        if (connectionNote) connectionNote.textContent = locale === 'en'
          ? 'This connection is not encrypted. Use HTTPS on local networks.'
          : '当前连接未加密。局域网登录请启用 HTTPS。';
      }

      function applyTheme(nextTheme, persist) {
        theme = nextTheme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (persist !== false) {
          try { localStorage.setItem(themeKey, theme); } catch (_) {}
        }
        updateToggleButtons();
      }

      function applyLocale(nextLocale, persist) {
        locale = nextLocale === 'en' ? 'en' : 'zh';
        document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN';
        if (persist !== false) {
          try { localStorage.setItem(localeKey, locale); } catch (_) {}
        }
        updateToggleButtons();
      }

      try {
        var savedTheme = localStorage.getItem(themeKey);
        if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
        else theme = document.documentElement.getAttribute('data-theme') || 'light';
      } catch (_) {
        theme = document.documentElement.getAttribute('data-theme') || 'light';
      }
      try {
        var savedLocale = localStorage.getItem(localeKey);
        if (savedLocale === 'zh' || savedLocale === 'en') locale = savedLocale;
      } catch (_) {}
      applyTheme(theme, false);
      applyLocale(locale, false);
      if (btnUiLocale) {
        btnUiLocale.addEventListener('click', function () {
          applyLocale(locale === 'en' ? 'zh' : 'en', true);
        });
      }
      if (btnUiTheme) {
        btnUiTheme.addEventListener('click', function () {
          applyTheme(theme === 'dark' ? 'light' : 'dark', true);
        });
      }

      if (window.location.protocol !== 'https:' && !['127.0.0.1', 'localhost', '::1'].includes(window.location.hostname)) {
        connectionNote.classList.add('show');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        message.textContent = '';
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username || !password) {
          message.textContent = '请输入用户名和密码。';
          return;
        }

        button.disabled = true;
        button.textContent = locale === 'en' ? 'Signing in…' : '登录中…';
        try {
          var response = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username: username, password: password, remember: !!(remember && remember.checked) })
          });
          var data = {};
          try { data = await response.json(); } catch (_) {}
          if (!response.ok) {
            message.textContent = (data.detail && data.detail.error) || '登录失败，请检查用户名和密码。';
            return;
          }
          window.location.replace('/voice');
        } catch (_) {
          message.textContent = '无法连接网关，请确认服务仍在运行。';
        } finally {
          button.disabled = false;
          button.textContent = locale === 'en' ? 'Sign in' : '登录';
        }
      });
    })();
  </script>
</body>
</html>
