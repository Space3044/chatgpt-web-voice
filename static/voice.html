  <script>
    (function () {
      try {
        var key = 'chatgpt_web_voice_theme_v1';
        var theme = localStorage.getItem(key);
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

      display: block;

      text-overflow: ellipsis;
    }
    body.app-shell .session-item-preview {

      text-overflow: ellipsis;
    }
    body.app-shell .session-item.active .session-item-preview { color: var(--session-active-preview); }

  function t(key, vars) {
    var table = I18N[uiLocale] || I18N.zh;
    var text = (table && table[key]) || (I18N.zh && I18N.zh[key]) || key;
    if (vars && typeof vars === 'object') {
      Object.keys(vars).forEach(function (k) {
        text = String(text).split('{' + k + '}').join(String(vars[k]));
      });
    }
    return text;
  }

  function detectUiLocale() {
    try {
      var saved = localStorage.getItem(uiLocaleStorageKey);
      if (saved === 'zh' || saved === 'en') return saved;
    } catch (e) {}
    var nav = (navigator.language || '').toLowerCase();
    return nav.indexOf('zh') === 0 ? 'zh' : 'en';
  }

  function detectUiTheme() {
    try {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') return attr;
      var saved = localStorage.getItem(uiThemeStorageKey);
      if (saved === 'light' || saved === 'dark') return saved;
    } catch (e) {}
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e2) {
      return 'dark';
    }
  }

  function updateLocaleThemeButtons() {

  async function loadGatewayVoiceConfig() {
    var response = await gatewayFetch('/api/voice/config');
    if (!response.ok) return;
    var config = await response.json();
    if (Array.isArray(config.voices) && config.voices.length) {
      chatgptVoiceOptions = config.voices.map(function (item) {
        return String(item.id || '').toLowerCase();
      }).filter(Boolean);
      var nextMeta = {};
      config.voices.forEach(function (item) {
        var id = String(item.id || '').toLowerCase();
        if (!id) return;
        nextMeta[id] = { name: String(item.name || id), description: String(item.description || '') };
      });
      chatgptVoiceMeta = nextMeta;
    }
    if (Array.isArray(config.languages) && config.languages.length) {
      spokenLanguageMeta = config.languages.map(function (item) {
        return [
          String(item.id || '').toLowerCase(),
          String(item.name_zh || item.id || ''),
          String(item.name_en || item.id || '')
        ];
      }).filter(function (item) { return !!item[0]; });
      spokenLanguageOptions = spokenLanguageMeta.map(function (item) { return item[0]; });
    }
    if (config.defaults && typeof config.defaults === 'object') {
      gatewayVoiceDefaults = {
        voice: String(config.defaults.voice || 'cove').toLowerCase(),
        voice_mode: String(config.defaults.voice_mode || 'wingman').toLowerCase(),
        language_code: String(config.defaults.language_code || 'auto').toLowerCase()
      };
    }
    if (config.webrtc && typeof config.webrtc === 'object') gatewayWebRTCConfig = config.webrtc;

  function clampText(value, limit) {
    var text = String(value || '').trim();
    if (text.length <= limit) return text;
    if (limit <= 3) return text.slice(0, Math.max(0, limit));
    return text.slice(0, limit - 3) + '...';
  }

  function newClientMessageId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return 'msg_' + window.crypto.randomUUID().replaceAll('-', '');
    return 'msg_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  }

  function timestampMillis(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value;
    var text = String(value || '').trim();
    if (!text) return Date.now();
    if (/^\d+(\.\d+)?$/.test(text)) return Number(text);
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(text)) text = text.replace(' ', 'T') + 'Z';
    var parsed = Date.parse(text);
    return Number.isFinite(parsed) ? parsed : Date.now();
  }

  function normalizeConversationMessage(message) {
    if (!message || (message.role !== 'user' && message.role !== 'assistant') || !String(message.content || '').trim()) return null;
    return {
      clientId: String(message.client_id || message.clientId || newClientMessageId()),
      role: message.role,
      content: clampText(message.content, 64 << 10),
      ts: timestampMillis(message.created_at || message.createdAt || message.ts)
    };
  }

  function normalizeStoredSession(item, messageLimit) {
    if (!item || !item.id) return null;
    var messages = Array.isArray(item.messages) ? item.messages.map(normalizeConversationMessage).filter(Boolean) : [];
    if (messageLimit === undefined) messageLimit = maxSessionMessages;
    if (messageLimit > 0) messages = messages.slice(-messageLimit);
    var last = messages[messages.length - 1];
    return {
      id: String(item.id),
      title: clampText(item.title, 120),
      preview: clampText(item.preview || (last && last.content) || '', 240),
      createdAt: timestampMillis(item.created_at || item.createdAt),
      updatedAt: timestampMillis(item.updated_at || item.updatedAt || item.created_at || item.createdAt),
      // chatgpt.com continuity — used to resume the same upstream thread after reconnect.
      accountId: Number(item.account_id || item.accountId || 0) || 0,
      upstreamConversationId: String(item.upstream_conversation_id || item.upstreamConversationId || '').trim(),
      upstreamParentMessageId: String(item.upstream_parent_message_id || item.upstreamParentMessageId || '').trim(),
      upstreamVoiceSessionId: String(item.upstream_voice_session_id || item.upstreamVoiceSessionId || '').trim(),
      gatewayVoiceSessionId: String(item.gateway_voice_session_id || item.gatewayVoiceSessionId || '').trim(),
      // User renamed: hangup must not overwrite with upstream title.
      titleLocked: !!(item.title_locked || item.titleLocked),
      messages: messages
    };
  }

  function applyUpstreamContextFromSession(session) {
    conversationId = (session && session.upstreamConversationId) || '';
    parentMessageId = (session && session.upstreamParentMessageId) || '';
    voiceSessionId = (session && session.gatewayVoiceSessionId) || '';
    upstreamVoiceSessionId = (session && session.upstreamVoiceSessionId) || '';
    stickyAccountId = (session && session.accountId) ? Number(session.accountId) || 0 : 0;
  }

  function schedulePersistUpstreamContext() {
    if (!activeSessionId) return;
    if (upstreamContextPersistTimer) clearTimeout(upstreamContextPersistTimer);
    upstreamContextPersistTimer = setTimeout(function () {
      upstreamContextPersistTimer = 0;
      persistUpstreamContextNow().catch(function (error) {
        log('persist upstream context fail', String(error && error.message || error));
      });
    }, 400);
  }

  async function persistUpstreamContextNow() {
    if (!conversationReady || !activeSessionId) return;
    var active = getActiveConversationSession();
    if (active) {
      active.accountId = stickyAccountId || 0;
      active.upstreamConversationId = conversationId || '';
      active.upstreamParentMessageId = parentMessageId || '';
      active.upstreamVoiceSessionId = upstreamVoiceSessionId || '';
      active.gatewayVoiceSessionId = voiceSessionId || '';
    }
    var body = {
      account_id: stickyAccountId || 0,
      upstream_conversation_id: conversationId || '',
      upstream_parent_message_id: parentMessageId || '',
      upstream_voice_session_id: upstreamVoiceSessionId || '',
      gateway_voice_session_id: voiceSessionId || ''
    };
    await conversationRequest('/api/conversations/' + encodeURIComponent(activeSessionId), {
      method: 'PATCH',
      body: JSON.stringify(body)
    });
    if (voiceSessionId && (conversationId || parentMessageId || upstreamVoiceSessionId)) {
      try {
        await gatewayFetch('/api/voice/session/context', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            voice_session_id: voiceSessionId,
            upstream_conversation_id: conversationId || '',
            upstream_parent_message_id: parentMessageId || '',
            upstream_voice_session_id: upstreamVoiceSessionId || ''
          })
        });
      } catch (error) {
        log('gateway context update fail', String(error && error.message || error));
      }
    }
  }

  function isPlaceholderLocalTitle(title) {
    var value = String(title || '').trim().toLowerCase();
    if (!value) return true;
    return value === 'new chat' || value === 'new conversation' || value === 'untitled' ||
      value === 'untitled conversation' || value === '新聊天' || value === '新对话' ||
      value === '新会话' || value === '未命名会话' || value === '未命名对话' ||
      value === String(t('sessionNew') || '').trim().toLowerCase() ||
      value === String(t('sessionUntitled') || '').trim().toLowerCase();
  }

  // Rehydrate continuity ids from the local conversation row when the in-memory
  // vars were cleared or never updated (e.g. telemetry only updated parent_id).
  function ensureUpstreamIdsForHangup() {
    var active = getActiveConversationSession();
    if (!active) return;
    if (!conversationId && active.upstreamConversationId) {
      conversationId = active.upstreamConversationId;
    }
    if (!parentMessageId && active.upstreamParentMessageId) {
      parentMessageId = active.upstreamParentMessageId;
    }
    if (!upstreamVoiceSessionId && active.upstreamVoiceSessionId) {
      upstreamVoiceSessionId = active.upstreamVoiceSessionId;
    }
    if (!voiceSessionId && active.gatewayVoiceSessionId) {
      voiceSessionId = active.gatewayVoiceSessionId;
    }
    if (!stickyAccountId && active.accountId) {
      stickyAccountId = Number(active.accountId) || 0;
    }
  }

  // Hangup-only upstream title fetch. Every hangup requests once unless the
  // user renamed (title_locked). Same conversation resume must still re-fetch
  // so a later official title can replace an earlier empty/first-utterance one.
  // Gateway may resolve conversation_id from the sticky binding when omitted.
  async function fetchAndApplyUpstreamTitle() {
    ensureUpstreamIdsForHangup();
    var active = getActiveConversationSession();
    if (active && active.titleLocked) titleLocked = true;
    if (upstreamTitleFetchInFlight) {
      return;
    }
    if (titleLocked) {
      return;
    }
    if (!voiceSessionId || !activeSessionId) {
      return;
    }
    upstreamTitleFetchInFlight = true;
    try {
      var query = '/api/voice/session/title?voice_session_id=' + encodeURIComponent(voiceSessionId);
      if (conversationId) {
        query += '&upstream_conversation_id=' + encodeURIComponent(conversationId);
      }
      var response = await gatewayFetch(query, { method: 'GET' });
      var data = {};
      try { data = await response.json(); } catch (e) {}
      if (!response.ok) {
        return;
      }
      if (!data.has_title || !data.title) {
        return;
      }
      if (data.upstream_conversation_id && !conversationId) {
        conversationId = String(data.upstream_conversation_id);
      }
      // Auto title: keep title_locked=false in SQLite.
      await renameConversationSession(activeSessionId, String(data.title), false);
      // Marks hangup-applied title so mid-call first-utterance logic stops
      // fighting the official title until the next new chat / conversation id.
      if (conversationId) upstreamTitleAppliedFor = conversationId;
    } finally {
      upstreamTitleFetchInFlight = false;
    }
  }

  // New chats start untitled; use the first non-empty user utterance as the
  // temporary local title until hangup replaces it with the upstream title.
  function maybeApplyFirstUserTitle(content) {
    if (titleLocked) return Promise.resolve();
    // After hangup applied an upstream title for this conversation, stop.
    if (upstreamTitleAppliedFor && conversationId && upstreamTitleAppliedFor === conversationId) {
      return Promise.resolve();
    }
    var active = getActiveConversationSession();
    if (!active || !activeSessionId) return Promise.resolve();
    if (active.titleLocked) {
      titleLocked = true;
      return Promise.resolve();
    }
    var title = clampText(String(content || '').trim(), 42);
    if (!title) return Promise.resolve();
    var current = String(active.title || '').trim();
    if (current && !isPlaceholderLocalTitle(current)) {
      // Allow STT deltas to grow/shrink the first-utterance title only.
      if (current === title) return Promise.resolve();
      if (!(title.indexOf(current) === 0 || current.indexOf(title) === 0)) return Promise.resolve();
    }
    // Auto first-utterance title: do not set title_locked.
    return renameConversationSession(activeSessionId, title, false).then(function () {
      log('first-utterance title applied', title);
    }).catch(function (error) {
      log('first-utterance title fail', String(error && error.message || error));
    });
  }

  async function conversationRequest(path, options) {
    options = options || {};
    if (options.body && !options.headers) options.headers = { 'content-type': 'application/json' };
    var response = await gatewayFetch(path, options);
    var data = {};
    try { data = await response.json(); } catch (e) {}
    if (!response.ok) {
      throw new Error((data.detail && data.detail.error) || ('HTTP ' + response.status));
    }
    return data;
  }

  async function migrateLegacyConversationSessions() {
    var legacy = [];
    try {
      legacy = JSON.parse(localStorage.getItem(legacySessionStorageKey) || '[]');
    } catch (e) {
      legacy = [];
    }
    if (!Array.isArray(legacy) || !legacy.length) return false;
    var sessions = legacy.map(function (item) { return normalizeStoredSession(item, 0); }).filter(Boolean);
    if (!sessions.length) {
      try { localStorage.removeItem(legacySessionStorageKey); } catch (e) {}
      return false;
    }
    for (var sessionIndex = sessions.length - 1; sessionIndex >= 0; sessionIndex--) {
      var legacySession = sessions[sessionIndex];
      var created = await conversationRequest('/api/conversations', {
        method: 'POST',
        body: JSON.stringify({ title: legacySession.title || '' })
      });
      var conversationID = created.conversation && created.conversation.id;
      if (!conversationID) throw new Error(t('conversationSaveFailed'));
      for (var messageIndex = 0; messageIndex < legacySession.messages.length; messageIndex++) {
        var legacyMessage = legacySession.messages[messageIndex];
        await conversationRequest('/api/conversations/' + encodeURIComponent(conversationID) + '/messages', {
          method: 'POST',
          body: JSON.stringify({
            client_id: legacyMessage.clientId || newClientMessageId(),
            role: legacyMessage.role,
            content: legacyMessage.content
          })
        });
      }
    }
    try { localStorage.removeItem(legacySessionStorageKey); } catch (e) {}
    toast(t('conversationMigrated'));
    return true;
  }

  async function loadConversationListFromServer() {
    var data = await conversationRequest('/api/conversations');
    conversationSessions = Array.isArray(data.conversations) ? data.conversations.map(function (item) { return normalizeStoredSession(item); }).filter(Boolean) : [];
    conversationSessions.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  }

  async function loadConversationDetail(id) {
    var data = await conversationRequest('/api/conversations/' + encodeURIComponent(id));
    var loaded = normalizeStoredSession(data.conversation || {});
    if (!loaded) throw new Error(t('conversationLoadFailed'));
    var index = conversationSessions.findIndex(function (item) { return item.id === loaded.id; });
    if (index >= 0) conversationSessions[index] = loaded;
    else conversationSessions.unshift(loaded);
    activeSessionId = loaded.id;
    currentSessionHistory = loaded.messages.slice(-maxSessionMessages);
    lastAssistantHistoryAt = 0;
    applyUpstreamContextFromSession(loaded);
    // Restore persisted rename lock from SQLite (title_locked).
    titleLocked = !!loaded.titleLocked;
    // Allow hangup to re-fetch upstream title for unlocked sessions.
    upstreamTitleAppliedFor = '';
    syncTranscriptFromHistory();
    updateSessionHeader();
    renderSessionList();
    renderTranscript();
    return loaded;
  }

  async function initializeConversationStore() {
    if (conversationReadyPromise) return conversationReadyPromise;
    conversationReadyPromise = (async function () {
      conversationReady = false;
      setComposerHint(t('conversationLoading'), 'loading');
      await migrateLegacyConversationSessions();
      await loadConversationListFromServer();
      if (!conversationSessions.length) {
        // First visit: create an empty local conversation so the page always
        // has a cv_* id from POST /api/conversations before any call/messages.
        var initial = await createLocalConversationOnServer('');
        conversationSessions = [initial];
      }
      activeSessionId = conversationSessions[0].id;
      await loadConversationDetail(activeSessionId);
      conversationReady = true;
      conversationSyncErrorShown = false;
      updateComposerState();
    })().catch(function (error) {
      conversationReady = false;
      conversationReadyPromise = null;
      setComposerHint(t('conversationLoadFailed') + ': ' + error.message, 'error');
      toast(t('conversationLoadFailed') + ': ' + error.message);
      throw error;
    });
    return conversationReadyPromise;
  }

  async function waitForConversationStore() {
    if (!conversationReadyPromise) initializeConversationStore();
    await conversationReadyPromise;
    if (!conversationReady) throw new Error(t('conversationNotReady'));
  }

  function getActiveConversationSession() {
    return conversationSessions.find(function (item) { return item.id === activeSessionId; }) || null;
  }

  function formatSessionTime(value) {
    var date = new Date(Number(value) || Date.now());
    if (Number.isNaN(date.getTime())) return '';
    try {
      return date.toLocaleDateString(uiLocale === 'en' ? 'en-US' : 'zh-CN', { month: 'short', day: 'numeric' }) + ' ' +
        date.toLocaleTimeString(uiLocale === 'en' ? 'en-US' : 'zh-CN', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return '';
    }
  }

  function updateSessionHeader() {
    if (!sessionTitle) return;
    var active = getActiveConversationSession();
    sessionTitle.textContent = active && active.title ? active.title : t('sessionNew');
  }

  function renderSessionList() {
    if (!sessionList) return;
    closeSessionContextMenu(false);
    sessionList.textContent = '';
    if (!conversationSessions.length) {
      var empty = document.createElement('div');
      empty.className = 'session-empty';
      empty.textContent = t('sessionEmpty');
      sessionList.appendChild(empty);
      return;
    }
    conversationSessions.forEach(function (session) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'session-item' + (session.id === activeSessionId ? ' active' : '');
      button.setAttribute('data-session-id', session.id);
      button.setAttribute('aria-haspopup', 'menu');
      var title = document.createElement('span');
      title.className = 'session-item-title';
      title.textContent = session.title || t('sessionNew');
      var preview = document.createElement('span');
      preview.className = 'session-item-preview';
      preview.textContent = session.preview || '';
      var time = document.createElement('span');
      time.className = 'session-item-time';
      time.textContent = formatSessionTime(session.updatedAt);
      button.appendChild(title);
      if (session.preview) button.appendChild(preview);
      button.appendChild(time);
      sessionList.appendChild(button);
    });
  }

  function findSessionButton(id) {
    if (!sessionList) return null;
    var buttons = sessionList.querySelectorAll('[data-session-id]');
    for (var index = 0; index < buttons.length; index++) {
      if (buttons[index].getAttribute('data-session-id') === id) return buttons[index];
    }
    return null;
  }

  function closeSessionContextMenu(restoreFocus) {
    if (!sessionContextMenu) return;
    var shouldRestore = !sessionContextMenu.hidden && restoreFocus;
    sessionContextMenu.hidden = true;
    sessionContextMenu.setAttribute('aria-hidden', 'true');
    contextMenuSessionId = '';
    if (sessionList) {
      var target = sessionList.querySelector('.context-target');
      if (target) target.classList.remove('context-target');
    }
    var focusTarget = contextMenuReturnFocus;
    contextMenuReturnFocus = null;
    if (shouldRestore && focusTarget && document.contains(focusTarget)) focusTarget.focus();
  }

  function openSessionContextMenu(id, clientX, clientY, returnFocus) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session || !sessionContextMenu) return;
    closeSessionContextMenu(false);
    contextMenuSessionId = id;
    contextMenuReturnFocus = returnFocus || findSessionButton(id);
    var target = findSessionButton(id);
    if (target) target.classList.add('context-target');
    sessionContextMenu.hidden = false;
    sessionContextMenu.setAttribute('aria-hidden', 'false');
    sessionContextMenu.style.visibility = 'hidden';
    sessionContextMenu.style.left = '0px';
    sessionContextMenu.style.top = '0px';
    var margin = 8;
    var left = Math.min(Math.max(margin, Number(clientX) || margin), Math.max(margin, window.innerWidth - sessionContextMenu.offsetWidth - margin));
    var top = Math.min(Math.max(margin, Number(clientY) || margin), Math.max(margin, window.innerHeight - sessionContextMenu.offsetHeight - margin));
    sessionContextMenu.style.left = left + 'px';
    sessionContextMenu.style.top = top + 'px';
    sessionContextMenu.style.visibility = '';
    var first = sessionContextMenu.querySelector('[role="menuitem"]');
    if (first) first.focus();
  }

  function openRenameConversationDialog(id) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session || !renameConversationDialog) return;
    closeSessionContextMenu(false);
    renameSessionId = id;
    renameConversationInput.value = session.title || '';
    renameConversationDialog.showModal();
    setTimeout(function () {
      renameConversationInput.focus();
      renameConversationInput.select();
    }, 0);
  }

  function openDeleteConversationDialog(id) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session || !deleteConversationDialog) return;
    closeSessionContextMenu(false);
    if (id === activeSessionId && (inCall || starting)) {
      toast(t('sessionDeleteBusy'));
      return;
    }
    deleteSessionId = id;
    deleteConversationMessage.textContent = t('deleteSessionMessage', { title: session.title || t('sessionNew') });
    deleteConversationDialog.showModal();
  }

  function safeConversationFileName(session) {
    var value = String((session && (session.title || session.id)) || 'conversation').trim();
    value = value.replace(/[<>:"/\\|?*\u0000-\u001f]+/g, '-').replace(/\s+/g, ' ');
    value = value.replace(/^[.\s]+|[.\s]+$/g, '').slice(0, 80);
    return value || 'conversation';
  }

  function conversationTXTContent(messages) {
    var rows = (Array.isArray(messages) ? messages : []).map(function (message) {
      if (!message || (message.role !== 'user' && message.role !== 'assistant')) return '';
      var content = String(message.content || '').trim();
      if (!content) return '';
      var role = message.role === 'assistant' ? t('roleAi') : t('roleYou');
      var time = formatTranscriptTime(timestampMillis(message.created_at || message.updated_at));
      return '[' + time + '] ' + role + (uiLocale === 'en' ? ': ' : '：') + content;
    }).filter(Boolean);
    return rows.length ? rows.join('\n\n') + '\n' : '';
  }

  async function writeClipboardText(text) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch (error) {}
    }
    // The conversation fetch can outlive transient user activation, so retain
    // the synchronous copy path for browsers that reject Async Clipboard here.
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '0';
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (error) {}
    textarea.remove();
    if (!copied) throw new Error(t('clipboardUnavailable'));
  }

  async function copyConversationSessionTXT(id) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session) return;
    closeSessionContextMenu(false);
    try {
      if (id === activeSessionId) await conversationWriteChain;
      var data = await conversationRequest('/api/conversations/' + encodeURIComponent(id));
      var text = conversationTXTContent(data.conversation && data.conversation.messages);
      if (!text) {
        toast(t('sessionCopyEmpty'));
        return;
      }
      await writeClipboardText(text);
      toast(t('sessionCopiedTXT'));
    } catch (error) {
      toast(t('sessionCopyFailed') + ': ' + error.message);
    }
  }

  async function exportConversationSession(id) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session) return;
    closeSessionContextMenu(false);
    try {
      if (id === activeSessionId) await conversationWriteChain;
      var data = await conversationRequest('/api/conversations/' + encodeURIComponent(id));
      var conversation = data.conversation || {};
      if (!Array.isArray(conversation.messages)) conversation.messages = [];
      var blob = new Blob([JSON.stringify(conversation, null, 2) + '\n'], { type: 'application/json;charset=utf-8' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = safeConversationFileName(conversation) + '.json';
      link.click();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 0);
      toast(t('sessionExported'));
    } catch (error) {
      toast(t('sessionExportFailed') + ': ' + error.message);
    }
  }

  // lockTitle: true = user rename (persist title_locked); false = auto title
  // (first utterance / hangup upstream); undefined = leave title_locked as-is.
  async function renameConversationSession(id, title, lockTitle) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session) return;
    var body = { title: title };
    if (lockTitle === true) body.title_locked = true;
    if (lockTitle === false) body.title_locked = false;
    var data = await conversationRequest('/api/conversations/' + encodeURIComponent(id), {
      method: 'PATCH',
      body: JSON.stringify(body)
    });
    var updated = data.conversation || {};
    session.title = clampText(updated.title || title, 120);
    session.preview = clampText(updated.preview || session.preview || '', 240);
    if (typeof updated.title_locked === 'boolean') {
      session.titleLocked = updated.title_locked;
    } else if (lockTitle === true || lockTitle === false) {
      session.titleLocked = !!lockTitle;
    }
    if (id === activeSessionId) titleLocked = !!session.titleLocked;
    session.updatedAt = timestampMillis(updated.updated_at || Date.now());
    conversationSessions.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    updateSessionHeader();
    renderSessionList();
  }

  async function deleteConversationSession(id) {
    var session = conversationSessions.find(function (item) { return item.id === id; });
    if (!session) return;
    if (id === activeSessionId && (inCall || starting)) {
      toast(t('sessionDeleteBusy'));
      return;
    }
    if (id === activeSessionId) await conversationWriteChain;
    await conversationRequest('/api/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
    var wasActive = id === activeSessionId;
    conversationSessions = conversationSessions.filter(function (item) { return item.id !== id; });
    if (!wasActive) {
      renderSessionList();
      return;
    }
    currentSessionHistory = [];
    currentTranscript = [];
    lastAssistantHistoryAt = 0;
    if (!conversationSessions.length) {
      var created = await conversationRequest('/api/conversations', {
        method: 'POST',
        body: JSON.stringify({ title: '' })
      });
      var replacement = normalizeStoredSession(created.conversation || {});
      if (!replacement) throw new Error(t('conversationLoadFailed'));
      conversationSessions = [replacement];
    }
    activeSessionId = conversationSessions[0].id;
    await loadConversationDetail(activeSessionId);
  }

  function handleSessionContextAction(action) {
    var id = contextMenuSessionId;
    closeSessionContextMenu(false);
    if (!id) return;
    if (action === 'rename') openRenameConversationDialog(id);
    else if (action === 'copy-txt') copyConversationSessionTXT(id);
    else if (action === 'export') exportConversationSession(id);
    else if (action === 'delete') openDeleteConversationDialog(id);
  }

  function syncTranscriptFromHistory() {
    currentTranscript = currentSessionHistory.map(function (item) {
      return {
        role: item.role,
        content: item.content,
        ts: item.ts
      };
    });
    trimTranscriptBuffer();
  }

  // Local conversation ids (cv_...) only come from POST /api/conversations.
  // Never invent client-side ids; message/title persistence requires this row.
  async function createLocalConversationOnServer(title) {
    var data = await conversationRequest('/api/conversations', {
      method: 'POST',
      body: JSON.stringify({ title: title || '' })
    });
    var session = normalizeStoredSession(data.conversation || {});
    if (!session || !session.id) throw new Error(t('conversationSaveFailed'));
    return session;
  }

  async function createConversationSession() {
    await waitForConversationStore();
    // New local chat must not reuse the previous chatgpt.com conversation.
    await releaseBackendVoiceSession(false);
    conversationId = '';
    parentMessageId = '';
    upstreamVoiceSessionId = '';
    stickyAccountId = 0;
    upstreamTitleAppliedFor = '';
    titleLocked = false;
    var session = await createLocalConversationOnServer('');
    conversationSessions.unshift(session);
    activeSessionId = session.id;
    currentSessionHistory = [];
    currentTranscript = [];
    lastAssistantHistoryAt = 0;
    applyUpstreamContextFromSession(session);
    updateSessionHeader();
    renderSessionList();
    renderTranscript();
    log('local conversation created', session.id);
    return session;
  }

  async function activateConversationSession(id) {
    if (inCall || starting) {
      toast(t('toastSessionBusy'));
      return;
    }
    try {
      await waitForConversationStore();
      await loadConversationDetail(id);
      document.body.classList.remove('sessions-open');
    } catch (error) {
      toast(t('conversationLoadFailed') + ': ' + error.message);
    }
  }

  // Before dialing: must have a local conversation id from create/list APIs.
  // Reuse the active one when present; otherwise create via POST /api/conversations.
  async function prepareCallSession() {
    await waitForConversationStore();
    var active = getActiveConversationSession();
    if (!active || !activeSessionId) {
      var session = await createLocalConversationOnServer('');
      conversationSessions.unshift(session);
      activeSessionId = session.id;
      currentSessionHistory = [];
      currentTranscript = [];
      lastAssistantHistoryAt = 0;
      applyUpstreamContextFromSession(session);
      updateSessionHeader();
      renderSessionList();
      renderTranscript();
      log('local conversation ensured for call', session.id);
      return session;
    }
    applyUpstreamContextFromSession(active);
    return active;
  }

  function loadCurrentSessionHistory() {
    return currentSessionHistory.filter(function (item) {
      return item && (item.role === 'user' || item.role === 'assistant') && String(item.content || '').trim();
    }).slice(-maxSessionMessages);
  }

  function saveCurrentSessionHistory(items) {
    currentSessionHistory = (items || []).slice(-maxSessionMessages);
    var active = getActiveConversationSession();
    if (!active) return;
    active.messages = currentSessionHistory.slice(-maxSessionMessages);
    var last = active.messages[active.messages.length - 1];
    active.preview = last ? clampText(last.content, 100) : '';
    active.updatedAt = Date.now();
    conversationSessions.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    updateSessionHeader();
    renderSessionList();
  }

  function persistConversationMessage(message) {
    if (!conversationReady || !activeSessionId || !message) return Promise.resolve();
    var conversationID = activeSessionId;
    var payload = {
      client_id: message.clientId || newClientMessageId(),
      role: message.role,
      content: message.content
    };
    message.clientId = payload.client_id;
    conversationWriteChain = conversationWriteChain.catch(function () {}).then(function () {
      return conversationRequest('/api/conversations/' + encodeURIComponent(conversationID) + '/messages', {
        method: 'POST',
        keepalive: true,
        body: JSON.stringify(payload)
      });
    }).then(function () {
      conversationSyncErrorShown = false;
    }).catch(function (error) {
      if (!conversationSyncErrorShown) {
        conversationSyncErrorShown = true;
        toast(t('conversationSaveFailed') + ': ' + error.message);
      }
    });
    return conversationWriteChain;
  }

  function resetCurrentSessionHistory() {
    currentSessionHistory = [];
    lastAssistantHistoryAt = 0;
    saveCurrentSessionHistory([]);
  }

  function formatTranscriptTime(value) {
    try {
      return new Date(value).toLocaleTimeString(uiLocale === 'en' ? 'en-US' : 'zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) {
      return '';
    }
  }

  function renderTranscript() {
    if (!transcriptList) return;
    var scrollHost = transcriptList.closest('.chat-stage');
    var transcriptSection = transcriptList.closest('.transcript');
    var shouldFollow = !scrollHost || scrollHost.scrollHeight - scrollHost.scrollTop - scrollHost.clientHeight < 80;
    transcriptList.textContent = '';
    if (!currentTranscript.length) {
      if (welcomeState) welcomeState.classList.remove('hidden');
      if (transcriptSection) transcriptSection.classList.add('empty');
      var empty = document.createElement('p');
      empty.className = 'caption-empty';
      empty.textContent = t('transcriptEmpty');
      transcriptList.appendChild(empty);
      return;
    }
    if (welcomeState) welcomeState.classList.add('hidden');
    if (transcriptSection) transcriptSection.classList.remove('empty');
    var fragment = document.createDocumentFragment();
    currentTranscript.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'caption-log-line ' + (item.role === 'assistant' ? 'assistant' : 'user');
      var avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = item.role === 'assistant' ? 'V' : (uiLocale === 'en' ? 'U' : '你');
      var body = document.createElement('div');
      body.className = 'message-body';
      var meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.textContent = (item.role === 'assistant' ? t('roleAi') : t('roleYou')) + ' · ' + formatTranscriptTime(item.ts);
      var bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      var content = document.createElement('span');
      content.className = 'caption-log-content';
      content.textContent = item.content;
      bubble.appendChild(content);
      body.appendChild(meta);
      body.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(body);
      fragment.appendChild(row);
    });
    transcriptList.appendChild(fragment);
    if (shouldFollow && scrollHost) scrollHost.scrollTop = scrollHost.scrollHeight;
  }

  function transcriptItemChars(item) {
    return String(item.content || '').length + 24;
  }

  function trimTranscriptBuffer() {
    if (currentTranscript.length > maxTranscriptItems) currentTranscript.splice(0, currentTranscript.length - maxTranscriptItems);
    var totalChars = currentTranscript.reduce(function (total, item) { return total + transcriptItemChars(item); }, 0);
    while (totalChars > maxTranscriptChars && currentTranscript.length > 1) {
      totalChars -= transcriptItemChars(currentTranscript.shift());
    }
  }

  function recordTranscript(role, content) {
    var clean = clampText(content, maxTranscriptItemChars);
    if (!clean) return;
    var next = { role: role, content: clean, ts: Date.now() };
    var last = currentTranscript[currentTranscript.length - 1];
    if (last && last.role === role && next.ts - Number(last.ts || 0) < 90000) {
      var previous = String(last.content || '');
      if (previous === next.content || next.content.indexOf(previous) === 0 || previous.indexOf(next.content) === 0) {
        last.content = next.content.length >= previous.length ? next.content : previous;
        last.ts = next.ts;
        renderTranscript();
        return;
      }
    }
    currentTranscript.push(next);
    trimTranscriptBuffer();
    renderTranscript();
  }

  function resetCurrentTranscript() {
    currentTranscript = [];
    renderTranscript();
  }

  function currentAutoInterruptProfile() {
    var selected = interruptSensitivity ? interruptSensitivity.value : 'balanced';
    return autoInterruptProfiles[selected] || autoInterruptProfiles.balanced;
  }

  function updateTranscriptMeta() {
    if (!transcriptMeta) return;
    var profile = currentAutoInterruptProfile();
    var suffix = autoInterruptCalibrationEndsAt ? t('calibrating') : '';
    transcriptMeta.textContent = t('transcriptMeta', { profile: profile.label, suffix: suffix });
  }

  function beginAutoInterruptCalibration() {
    var profile = currentAutoInterruptProfile();
    currentAutoInterruptRms = profile.rms;
    currentAutoInterruptHoldMs = profile.holdMs;
    autoInterruptCalibrationSamples = [];
    autoInterruptAmbientRms = 0;
    autoInterruptCalibrationEndsAt = inCall ? Date.now() + 2400 : 0;
    updateTranscriptMeta();
  }

  function observeAutoInterruptCalibration(rms) {
    if (!inCall || muted || assistantSpeaking || !autoInterruptCalibrationEndsAt) return;
    var now = Date.now();
    if (now < autoInterruptCalibrationEndsAt) {
      if (rms >= 0 && rms < 0.55) autoInterruptCalibrationSamples.push(rms);
      return;
    }
    var profile = currentAutoInterruptProfile();
    var samples = autoInterruptCalibrationSamples.slice().sort(function (a, b) { return a - b; });
    if (samples.length) autoInterruptAmbientRms = samples[Math.floor((samples.length - 1) * 0.2)];
    currentAutoInterruptRms = Math.min(0.48, Math.max(profile.rms, autoInterruptAmbientRms + 0.10));
    currentAutoInterruptHoldMs = profile.holdMs;
    autoInterruptCalibrationEndsAt = 0;
    updateTranscriptMeta();
  }

  function rememberLocalMessage(role, content) {
    var clean = String(content || '').trim();
    if (!clean) return;
    var items = loadCurrentSessionHistory();
    var now = Date.now();
    var last = items[items.length - 1];
    var isFirstUser = role === 'user' && !items.some(function (item) {
      return item && item.role === 'user' && String(item.content || '').trim();
    });
    if (last && last.role === role && now - Number(last.ts || 0) < 45000) {
      var previous = String(last.content || '');
      if (previous === clean || clean.indexOf(previous) === 0 || previous.indexOf(clean) === 0) {
        last.content = clean.length >= previous.length ? clean : previous;
        last.ts = now;
        if (!last.clientId) last.clientId = newClientMessageId();
        saveCurrentSessionHistory(items);
        persistConversationMessage(last);
        recordTranscript(role, last.content);
        // Growing first user caption (STT deltas) should refresh the temp title.
        if (role === 'user' && (isFirstUser || items.filter(function (item) {
          return item && item.role === 'user';
        }).length === 1)) {
          maybeApplyFirstUserTitle(last.content);
        }
        return;
      }
    }
    var message = {
      clientId: newClientMessageId(),
      role: role,
      content: clean,
      ts: now
    };
    items.push(message);
    saveCurrentSessionHistory(items);
    persistConversationMessage(message);
    recordTranscript(role, clean);
    if (role === 'user' && isFirstUser) maybeApplyFirstUserTitle(clean);
  }

  function rememberAssistantText(text) {
    var clean = String(text || '').trim();
    if (!clean || clean.charAt(0) === '（') return;
    if (Date.now() < suppressPreviewAssistantUntil) {
      var previewText = clean.replace(/[，。！？!?\s.,]/g, '').toLowerCase();
      if (previewText === '你好' || previewText === 'hello') return;
    }
    var now = Date.now();
    var items = loadCurrentSessionHistory();
    var last = items[items.length - 1];
    var message;
    if (last && last.role === 'assistant' && now - lastAssistantHistoryAt < 90000) {
      last.content = clean;
      last.ts = now;
      if (!last.clientId) last.clientId = newClientMessageId();
      message = last;
    } else {
      message = { clientId: newClientMessageId(), role: 'assistant', content: clean, ts: now };
      items.push(message);
    }
    lastAssistantHistoryAt = now;
    saveCurrentSessionHistory(items);
    persistConversationMessage(message);
    recordTranscript('assistant', clean);
  }

  function normalizeVoice(value) {
    var clean = String(value || '').trim().toLowerCase();
    clean = chatgptVoiceAliases[clean] || clean;
    return chatgptVoiceOptions.indexOf(clean) >= 0 ? clean : gatewayVoiceDefaults.voice;
  }

  function normalizeLanguage(value) {
    var clean = String(value || '').trim().toLowerCase();
    return spokenLanguageOptions.indexOf(clean) >= 0 ? clean : gatewayVoiceDefaults.language_code;
  }

  function voiceLabel(value) {
    var meta = chatgptVoiceMeta[normalizeVoice(value)] || chatgptVoiceMeta[gatewayVoiceDefaults.voice];
    return meta.name + ' - ' + meta.description;
  }

  var toastTimer = 0;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  function log() {
    return;
  }

  function setUI(state, title, sub, titleKey, subKey, titleVars, subVars) {
    lastUiState = {
      state: state || 'idle',
      title: title || '',
      sub: sub || '',
      titleKey: titleKey || '',
      subKey: subKey || '',
      titleVars: titleVars || null,
      subVars: subVars || null
    };
    orb.className = 'orb ' + (state || 'idle');
    statusText.textContent = title || '';
    subText.textContent = sub || '';
    updateCallControls();
    updateComposerState();
  }

  function isDataChannelReady() {
    return !!(dcChannel && dcChannel.readyState === 'open');
  }

  // SDP may succeed before ICE/DataChannel finish. Treat the call as "live" for
  // hangup, but only unlock the text composer when the realtime channel is open.
  function isComposerReady() {
    return !!inCall && isDataChannelReady() && !sending;
  }

  function markCallLive(uiState, titleKey, subKey) {
    inCall = true;
    beginAutoInterruptCalibration();
    setUIKey(uiState || 'listening', titleKey || 'statusListening', subKey || 'subConnected');
    updateCallControls();
    updateComposerState();
  }

  function updateCallControls() {
    // Keep "connecting" while SDP is in flight OR after SDP until the DataChannel opens.
    var connecting = (!!starting && !inCall) || (!!inCall && !isDataChannelReady());
    if (btnMain) {
      btnMain.classList.toggle('is-idle', !inCall && !connecting);
      btnMain.classList.toggle('is-connecting', connecting && !inCall);
      btnMain.classList.toggle('is-live', !!inCall && isDataChannelReady());
      btnMain.classList.toggle('stop', !!inCall);
      if (connecting && !inCall) {
        // Pre-SDP: cannot hang up yet (startCall still owns the flow).
        btnMain.textContent = t('statusConnecting');
        btnMain.setAttribute('title', t('statusConnecting'));
        btnMain.disabled = true;
      } else if (inCall) {
        // After SDP: always allow hangup. Status text may still say "连接中"
        // until the DataChannel opens; the composer stays locked separately.
        btnMain.textContent = t('end');
        btnMain.setAttribute('title', t('end'));
        btnMain.disabled = false;
        btnMain.classList.toggle('stop', true);

        } else {

      } catch (e) {
        try { remotePlaybackGain.gain.value = gain; } catch (e2) {}

      // Web Audio when the element is muted.

  async function ensureRemotePlaybackGraph(stream) {

      applyPlaybackGain();
      return true;
    }
    disconnectRemotePlaybackGraph();
    try {
      remotePlaybackSource = audioCtx.createMediaStreamSource(stream);
      remotePlaybackGain = audioCtx.createGain();
      remotePlaybackGain.gain.value = effectivePlaybackGain();
      remotePlaybackSource.connect(remotePlaybackGain);
      remotePlaybackGain.connect(audioCtx.destination);
      remotePlaybackConnected = true;
      applyPlaybackGain();
      log('remote playback graph', 'gain=' + remotePlaybackGain.gain.value);
      return true;

  function extractTextParts(parts) {
    if (!Array.isArray(parts)) return '';

      if (typeof part === 'string') return part;
      if (!part || typeof part !== 'object') return '';
      if (typeof part.text === 'string') return part.text;
      if (typeof part.content === 'string') return part.content;
      if (part.content && typeof part.content.text === 'string') return part.content.text;
      if (typeof part.transcript === 'string') return part.transcript;

  function applyCaptionDelta(state, delta) {
    var previous = state && typeof state === 'object' ? state : {};

      role: previous.role === 'assistant' || previous.role === 'user' ? previous.role : '',
      messageId: String(previous.messageId || ''),
      text: String(previous.text || '')

    if (!delta || typeof delta !== 'object') return next;

    var message = delta.v && delta.v.message;
    if (message && typeof message === 'object') {
      var parts = message.content && Array.isArray(message.content.parts) ? message.content.parts : [];
      var role = (message.author && message.author.role) || '';
      if (role !== 'assistant' && role !== 'user') {
        for (var partIndex = 0; partIndex < parts.length; partIndex++) {
          var part = parts[partIndex];
          if (!part || typeof part !== 'object' || part.content_type !== 'audio_transcription') continue;
          if (part.direction === 'in') role = 'user';
          if (part.direction === 'out') role = 'assistant';
          break;
        }
      }
      if (role !== 'assistant' && role !== 'user') return next;
      var text = parts.map(function (part) {
        if (typeof part === 'string') return part;
        if (!part || typeof part !== 'object') return '';
        if (typeof part.text === 'string') return part.text;
        if (typeof part.content === 'string') return part.content;
        if (typeof part.transcript === 'string') return part.transcript;
        return '';
      }).filter(Boolean).join('\n').trim();
      return {
        role: role,
        messageId: message.id ? String(message.id) : next.messageId,
        text: text
      };
    }

    if (!Array.isArray(delta.v) || !next.role) return next;
    var appended = '';
    for (var operationIndex = 0; operationIndex < delta.v.length; operationIndex++) {
      var operation = delta.v[operationIndex];
      if (!operation || operation.o !== 'append') continue;
      if (!/^\/message\/content\/parts\/\d+\/text$/.test(String(operation.p || ''))) continue;
      appended += String(operation.v || '');

      await warmMicPermission();

      previewPc = pcLocal;
      var deviceId = micSelect.value;
      var constraints = deviceId
        ? { video: false, audio: { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true } }
        : { video: false, audio: true };
      try {

      } catch (e) {

      }

        previewAudio.playsInline = true;

        sendRelayMessageTo(previewDc, message);

        method: 'POST',
