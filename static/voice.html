      var st = (p && p.type === 'startup_telemetry') ? p : obj;
      var stChanged = false;
      if (st.conversation_id && st.conversation_id !== conversationId) {
        conversationId = st.conversation_id;
        upstreamTitleAppliedFor = '';
        stChanged = true;
        log('conversation_id', conversationId);
      }
      if (st.voice_session_id && String(st.voice_session_id) !== upstreamVoiceSessionId) {
        upstreamVoiceSessionId = String(st.voice_session_id);
        stChanged = true;
      }
      // Title is not fetched mid-call; hangup pulls the upstream title once.
      if (stChanged) schedulePersistUpstreamContext();
      updateComposerState();
    }
    if (t === 'conversation_update' || (p && p.type === 'conversation_update')) {
      var cu = (p && p.type === 'conversation_update') ? p : obj;
      var cuChanged = false;
      if (cu.conversation_id && cu.conversation_id !== conversationId) {
        conversationId = cu.conversation_id;
        upstreamTitleAppliedFor = '';
        cuChanged = true;
      }
      if (cu.parent_message_id && cu.parent_message_id !== parentMessageId) {
        parentMessageId = cu.parent_message_id;
        cuChanged = true;
      }
      log('conversation_update', conversationId, parentMessageId);
      if (cuChanged) schedulePersistUpstreamContext();
      updateComposerState();
    }
    // Ignore mid-call title_generation: local title stays first-utterance until hangup.
    if (t === 'title_generation' || (p && p.type === 'title_generation')) {
      var tg = (p && p.type === 'title_generation') ? p : obj;
      if (tg.conversation_id && tg.conversation_id !== conversationId) {
        conversationId = tg.conversation_id;
        schedulePersistUpstreamContext();
      }
    }
    // 语音内旁路：user/assistant 的 chat_message_delta
    if (t === 'chat_message_delta' || (p && p.type === 'chat_message_delta')) {
      var d = (p && p.type === 'chat_message_delta') ? p : obj;
      var delta = d.delta || (d.payload && d.payload.delta) || {};
      if (delta && delta.v && delta.v.message) {
        var msg = delta.v.message;
        var role = (msg.author && msg.author.role) || '';
        if (msg.id && (role === 'assistant' || role === 'user') && String(msg.id) !== parentMessageId) {
          parentMessageId = msg.id;
          schedulePersistUpstreamContext();
        }
      }
      var priorCaptionRole = streamingCaptionRole;
      var priorCaptionMessageId = streamingCaptionMessageId;
      var priorCaptionText = streamingCaptionText;
      var nextCaption = applyCaptionDelta({
        role: streamingCaptionRole,
        messageId: streamingCaptionMessageId,
        text: streamingCaptionText
      }, delta);
      streamingCaptionRole = nextCaption.role;
      streamingCaptionMessageId = nextCaption.messageId;
      streamingCaptionText = nextCaption.text;
      if (nextCaption.role && nextCaption.text && (
        nextCaption.role !== priorCaptionRole ||
        nextCaption.messageId !== priorCaptionMessageId ||
        nextCaption.text !== priorCaptionText
      )) {
        rememberDcText(nextCaption.role, nextCaption.text);
      }
      updateComposerState();
    }
    // Realtime 风格 transcript 事件（若有），用于刷新后恢复本地上下文。
    if (t.indexOf('input_audio') >= 0 && t.indexOf('transcription') >= 0) {
      rememberDcText('user', extractTranscriptText(obj, p));
    } else if (t.indexOf('audio_transcript') >= 0 || t.indexOf('response.audio_transcript') >= 0) {
      rememberDcText('assistant', extractTranscriptText(obj, p));
    }
  }

  async function gatewayFetch(url, options) {
    options = options || {};
    options.credentials = 'same-origin';
    options.headers = options.headers || {};
    var method = String(options.method || 'GET').toUpperCase();
    if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {
      options.headers = withCSRFHeaders(options.headers);
    }
    var response = await fetch(url, options);
    if (response.status === 401) {
      window.location.replace('/login');
      throw new Error(t('errAuthExpired'));
    }
    return response;
  }

  // Release gateway in-memory account binding. Durable SQLite metadata remains
  // so the next dial can restore sticky account + upstream ids.
  // keepLocal=true (hangup): keep voiceSessionId / sticky ids in the page.
  // keepLocal=false (new chat): clear local gateway session id.
  async function releaseBackendVoiceSession(keepLocal) {
    var sessionId = voiceSessionId;
    if (!sessionId) return;
    if (!keepLocal) voiceSessionId = '';
    try {
      await gatewayFetch('/api/voice/session/release', {
        method: 'POST',
        headers: {
          'content-type': 'application/json'
        },
        body: JSON.stringify({ voice_session_id: sessionId }),
        keepalive: true
      });
    } catch (e) {}
  }

  // Closing / refreshing the tab usually skips the hangup button path. Fire a
  // best-effort release so admin call_sessions does not stay active forever.
  // keepalive fetch may still lose the race on hard kills; startup orphan
  // cleanup remains the final safety net.
  function releaseOnPageExit() {
    if (!(inCall || starting) || !voiceSessionId) return;
    try {
      fetch('/api/voice/session/release', {
        method: 'POST',
        credentials: 'same-origin',
        headers: withCSRFHeaders({ 'content-type': 'application/json' }),
        body: JSON.stringify({ voice_session_id: voiceSessionId }),
        keepalive: true
      });
    } catch (e) {}
  }

  async function sendTextMessage() {
    if (sending) return;
    if (!inCall) {
      toast(t('composerHintIdle'));
      return;
    }
    if (!isDataChannelReady()) {
      toast(t('errDcNotReady'));
      updateComposerState();
      return;
    }
    var text = (textInput.value || '').trim();
    if (!text) { toast(t('toastNeedContent')); return; }
    sending = true;
    updateComposerState();
    setUIKey('speaking', 'statusProcessing', 'subDcSubmit');
    try {
      var message = buildBaseUserMessage({
        content_type: 'text',
        parts: [text]
      });
      sendRelayMessage(message);
      parentMessageId = message.id;
      textInput.value = '';
      autoResizeComposer();
      rememberLocalMessage('user', text);
      showReply(t('replyTextSent'), false);
      toast(t('toastTextSent'));
      log('dc relay text ok', message.id, text.slice(0, 120));
      setUIKey('listening', 'statusListening', 'subTextInSession');
    } catch (e) {
      toast(String(e.message || e));
      log('send text error', String(e));
      setUI('error', t('statusSendFail'), String(e.message || e), 'statusSendFail', '', null, null);
    } finally {
      sending = false;
      updateComposerState();
    }
  }

  function isVirtualMic(label) {
    return /todesk|virtual|cable|stereo mix|vb-audio|voicemeeter|blackhole/i.test(label || '');
  }
  function scoreMic(label) {
    label = label || '';
    if (isVirtualMic(label)) return -100;
    var s = 10;
    if (/ugreen|usb|headset|realtek|麦克风|microphone|array/i.test(label)) s += 20;
    if (/默认|default|通信|communication/i.test(label)) s += 5;
    return s;
  }

  async function refreshMics() {
    try {
      var devices = await navigator.mediaDevices.enumerateDevices();
      var inputs = devices.filter(function (d) { return d.kind === 'audioinput'; });
      var prev = micSelect.value;
      micSelect.innerHTML = '';
      var bestId = '', best = -999;
      inputs.forEach(function (d, i) {
        var opt = document.createElement('option');
        opt.value = d.deviceId;
        var label = d.label || t('micFallback', { n: i + 1 });
        opt.textContent = isVirtualMic(label) ? (label + t('micNotRecommended')) : label;
        micSelect.appendChild(opt);
        var sc = scoreMic(label);
        if (sc > best) { best = sc; bestId = d.deviceId; }
      });
      if (!inputs.length) {
        var o = document.createElement('option');
        o.value = ''; o.textContent = t('micNone');
        micSelect.appendChild(o);
      } else if (prev) {
        micSelect.value = prev;
      } else if (bestId) {
        micSelect.value = bestId;
      }
      log('mics', inputs.map(function (d) { return d.label; }), 'selected', micSelect.options[micSelect.selectedIndex] && micSelect.options[micSelect.selectedIndex].textContent);
    } catch (e) {
      log('refreshMics fail', String(e));
    }
  }

  async function ensureCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try {
          // Prefer low-latency when available (helps mobile WebRTC playback feel responsive).
          audioCtx = new AC({ latencyHint: 'interactive' });
        } catch (e) {
          audioCtx = new AC();
        }
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
  }

  function preferSpeakerOutput() {
    // Best-effort: some Chromium mobile builds expose audioSession.type.
    // 'playback' routes toward media/speaker instead of earpiece call route when supported.
    try {
      if (navigator.audioSession) {
        if ('type' in navigator.audioSession) navigator.audioSession.type = 'playback';
      }
    } catch (e) {}
    try {
      if (remoteAudio && typeof remoteAudio.setSinkId === 'function') {
        // Empty string = default system output (cannot force loudspeaker on most phones).
        remoteAudio.setSinkId('').catch(function () {});
      }
    } catch (e) {}
  }

  function initWaveBars() {
    function fill(container) {
      if (!container) return [];
      container.textContent = '';
      var bars = [];
      for (var i = 0; i < WAVE_BAR_COUNT; i++) {
        var span = document.createElement('span');
        container.appendChild(span);
        bars.push(span);
      }
      return bars;
    }
    localWaveBars = fill(localWaveBarsEl);
    remoteWaveBars = fill(remoteWaveBarsEl);
    setWaveLevel('local', 0);
    setWaveLevel('remote', 0);
  }

  function setWaveLevel(which, level) {
    var bars = which === 'local' ? localWaveBars : remoteWaveBars;
    var shell = which === 'local' ? localWaveEl : remoteWaveEl;
    if (!bars || !bars.length) return;
    var value = Math.max(0, Math.min(1, Number(level) || 0));
    var active = value > 0.035;
    if (shell) shell.classList.toggle('active', active);
    var center = (bars.length - 1) / 2;
    for (var i = 0; i < bars.length; i++) {
      var dist = Math.abs(i - center) / Math.max(1, center);
      var shape = 1 - dist * 0.72;
      var wobble = 0.72 + 0.28 * Math.sin((i * 1.7) + value * 9.5);
      var height = 14 + value * shape * wobble * 86;
      bars[i].style.height = Math.max(14, Math.min(100, height)).toFixed(1) + '%';
      bars[i].style.opacity = active ? String(0.45 + value * 0.55) : '0.35';
    }
  }

  function startMeter(stream, which) {
    try {
      if (!stream) return;
      ensureCtx();
      if (!audioCtx) return;
      var source = audioCtx.createMediaStreamSource(stream);
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);
      function tick() {
        analyser.getByteTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) {
          var v = (data[i] - 128) / 128;
          sum += v * v;
        }
        var rms = Math.min(1, Math.sqrt(sum / data.length) * 4);
        if (which === 'local') {
          setWaveLevel('local', rms);
          evaluateAutoInterrupt(rms);
          localRaf = requestAnimationFrame(tick);
        } else {
          setWaveLevel('remote', rms);
          // Hold remote speaking state through short pauses in the assistant audio.
          // Allow energy detection even while playback is suppressed, so a new
          // assistant turn can clear the barge-in mute without toggling speaker.
          // Still ignore energy during the short stop_speaking settle window.
          if (inCall && !speakerMuted && !awaitingInterruptAck && rms > 0.08) {
            remoteSpeakingUntil = Date.now() + 900;
            markAssistantSpeaking();
            if (statusText.textContent !== t('statusSpeaking')) setUIKey('speaking', 'statusSpeaking', 'subSpeaking');
          } else if (inCall && statusText.textContent === t('statusSpeaking') && Date.now() > remoteSpeakingUntil) {
            markAssistantListening();
            setUIKey('listening', 'statusListening', 'subContinue');
          }
          remoteRaf = requestAnimationFrame(tick);
        }
      }
      if (which === 'local') {
        if (localRaf) cancelAnimationFrame(localRaf);
        if (localSource) try { localSource.disconnect(); } catch (e) {}
        localSource = source; localAnalyser = analyser; tick();
      } else {
        if (remoteRaf) cancelAnimationFrame(remoteRaf);
        if (remoteSource) try { remoteSource.disconnect(); } catch (e) {}
        remoteSource = source; remoteAnalyser = analyser; tick();
      }
    } catch (e) {
      log('meter fail', String(e));
    }
  }

  async function requestMic() {
    if (!window.isSecureContext) {
      throw new Error(t('errInsecure'));
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error(t('errNoMicApi'));
    await refreshMics();
    var deviceId = micSelect.value;
    var constraints = deviceId
      ? { video: false, audio: { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true } }
      : { video: false, audio: true };
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    }
    var label = (stream.getAudioTracks()[0] && stream.getAudioTracks()[0].label) || '';
    if (isVirtualMic(label)) {
      toast(t('toastVirtualMic'));
    }
    startMeter(stream, 'local');
    await refreshMics();
    return stream;
  }

  async function ensureRemotePlay(force) {
    try {
      await ensureCtx();
      preferSpeakerOutput();
      if (!remoteAudio.srcObject && !remoteStream) return;
      if ((playbackSuppressed || speakerMuted) && !force) return;
      if (force) {
        speakerMuted = false;
        clearInterruptAckWait();
        playbackSuppressed = false;
        updateCallControls();
      }
      // Start the <audio> element first (iOS/Safari often needs this before Web Audio taps the stream).
      if (remoteAudio.srcObject) {
        if (!remotePlaybackConnected) {
          remoteAudio.muted = false;
          remoteAudio.volume = Math.min(1, Math.max(0, playbackVolume));
        } else {
          // Graph owns audible output; keep element playing so MediaStream stays hot.
          remoteAudio.muted = false;
          remoteAudio.volume = 0;
        }
        if (remoteAudio.paused) {
          var p = remoteAudio.play();
          if (p && p.then) await p;
        }
      }
      var stream = remoteStream || remoteAudio.srcObject;
      if (stream) {
        // Prefer Web Audio gain path so volume can exceed 100% on quiet mobile call routes.
        await ensureRemotePlaybackGraph(stream);
      } else {
        applyPlaybackGain();
      }
      // Mobile browsers suspend AudioContext after backgrounding; resume is cheap.
      if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
      log('remote playing', !remoteAudio.paused, 'graph=', remotePlaybackConnected, 'gain=', playbackVolume);
    } catch (e) {
      log('play fail', String(e));
      toast(t('toastClickSpeaker'));
    }
  }

  async function startCall() {
    if (starting || inCall) return;
    starting = true;
    try {
      await stopVoicePreviewOnly();
      // User gesture: unlock audio and prefer media/playback route when the browser allows it.
      preferSpeakerOutput();
      await ensureCtx();
      setUIKey('connecting', 'statusConnecting', 'subMic');
      await stopCall(false);
      await prepareCallSession();
      updateTranscriptMeta();

      localStream = await requestMic();
      setUIKey('connecting', 'statusConnecting', 'subEstablishing');

      pc = newVoicePeerConnection();
      // Capture this PC instance so late events after stopCall(pc=null) are ignored.
      var connection = pc;

      try {
        var dc = createVoiceDataChannel(connection);
        dcChannel = dc;
        dc.onopen = function () {
          if (pc !== connection) return;
          log('dc open');
          // Prefer DC open as the moment the call becomes fully usable for text.
          if (inCall || connection.remoteDescription) {
            markCallLive('listening', 'statusListening', 'subConnected');
          } else {
            updateComposerState();
            updateCallControls();
          }
          setTimeout(onVoiceChannelReady, 700);
        };
        dc.onclose = function () {
          log('dc close');
          if (dcChannel === dc) dcChannel = null;
          if (pc !== connection) return;
          updateComposerState();
          updateCallControls();
        };
        dc.onerror = function (e) { log('dc error', e); };
        dc.onmessage = function (ev) {
          if (pc !== connection) return;
          try {
            var obj = JSON.parse(ev.data);
            var inner = obj;
            if (obj.type === 'data_message' && typeof obj.data === 'string') inner = JSON.parse(obj.data);
            var t = inner.type || obj.type;
            log('dc', t, inner);
            if (t === 'state_update') {
              var st = (inner.payload && inner.payload.new_state) || '';
              if (st === 'listening') {
                markAssistantListening();
                setUIKey('listening', 'statusListening', 'subListening');
              }
              if (st === 'speaking' || st === 'responding') {
                markAssistantSpeaking();
                setUIKey('speaking', 'statusSpeaking', 'subReplying');
              }
              if (st === 'idle') {
                markAssistantListening();
                setUIKey('listening', 'statusListening', 'subContinue');
              }
            }
            handleDcPayload(obj);
          } catch (e) {
            log('dc raw', ev.data);
          }
        };
      } catch (e) { log('dc fail', String(e)); }

      localStream.getTracks().forEach(function (t) { connection.addTrack(t, localStream); });

      connection.ontrack = function (ev) {
        if (pc !== connection) return;
        log('ontrack', ev.track.kind, 'muted=', ev.track.muted);
        if (ev.streams && ev.streams[0]) remoteStream = ev.streams[0];
        else {
          if (!remoteStream) remoteStream = new MediaStream();
          remoteStream.addTrack(ev.track);
        }
        remoteAudio.srcObject = remoteStream;
        preferSpeakerOutput();
        ensureRemotePlay();
        startMeter(remoteStream, 'remote');
      };
      connection.oniceconnectionstatechange = function () {
        if (pc !== connection) return;
        log('ice', connection.iceConnectionState);
        if (connection.iceConnectionState === 'failed') {
          // ICE failure is terminal: tear down fully so controls leave the live/connecting state.
          endCallFromTransport('failed');
        } else if (connection.iceConnectionState === 'connected' || connection.iceConnectionState === 'completed') {
          clearDisconnectWatch();
        }
      };
      connection.onconnectionstatechange = function () {
        if (pc !== connection) return;
        log('conn', connection.connectionState);
        if (connection.connectionState === 'connected') {
          clearDisconnectWatch();
          // Media path is up; unlock hangup, but text still waits for DC open.
          inCall = true;
          beginAutoInterruptCalibration();
          if (isDataChannelReady()) {
            markCallLive('listening', 'statusListening', 'subConnected');
          } else {
            setUIKey('connecting', 'statusConnecting', 'subEntering');
            updateCallControls();
            updateComposerState();
          }
          setTimeout(onVoiceChannelReady, 700);
          return;
        }
        if (connection.connectionState === 'failed') {
          endCallFromTransport('failed');
          return;
        }
        if (connection.connectionState === 'disconnected') {
          // Brief ICE blips can report disconnected; only end the call if it stays down.
          scheduleDisconnectWatch();
          return;
        }
        if (connection.connectionState === 'closed') {
          // Intentional pc.close() also lands here; stopCall owns the final UI.
          if (inCall && !stoppingCall) endCallFromTransport('closed');
        }
      };

      var offer = await connection.createOffer(voiceOfferOptions());
      await connection.setLocalDescription(offer);
      await new Promise(function (resolve) {
        if (connection.iceGatheringState === 'complete') return resolve();
        var t = setTimeout(resolve, 2500);
        connection.onicegatheringstatechange = function () {
          if (connection.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
        };
      });

      var resp = await gatewayFetch('/api/voice/session', {
        method: 'POST',
        headers: {
          'content-type': 'application/json'
        },
        body: JSON.stringify({
          offer_sdp: pc.localDescription.sdp,
          voice: normalizeVoice(voiceEl.value),
          voice_mode: (document.getElementById('voiceMode').value || gatewayVoiceDefaults.voice_mode).trim(),
          language_code: normalizeLanguage(languageEl && languageEl.value),
          voice_session_id: voiceSessionId || '',
          account_id: stickyAccountId || 0,
          upstream_conversation_id: conversationId || '',
          upstream_parent_message_id: parentMessageId || '',
          upstream_voice_session_id: upstreamVoiceSessionId || ''
        })
      });
      var data = {};
      try { data = await resp.json(); } catch (e) {}
      if (!resp.ok) {
        var msg = (data && data.detail && (data.detail.error || JSON.stringify(data.detail))) || ('HTTP ' + resp.status);
        // Stale gateway binding / expired resume ids: drop sticky fields and let the user retry.
        if (resp.status === 404 || resp.status === 403) {
          voiceSessionId = '';
          schedulePersistUpstreamContext();
        }
        // Bound account gone or disabled: clear sticky account so user can start a new thread.
        if (resp.status === 401 || resp.status === 503) {
          if (stickyAccountId > 0 && (String(msg).indexOf('preferred account') >= 0 || String(msg).indexOf('bound account') >= 0 || String(msg).indexOf('unavailable') >= 0)) {
            stickyAccountId = 0;
            voiceSessionId = '';
            conversationId = '';
            parentMessageId = '';
            upstreamVoiceSessionId = '';
            schedulePersistUpstreamContext();
          }
        }
        setUI('error', t('statusStartFail'), msg, 'statusStartFail', '', null, null);
        toast(msg);
        await stopCall(false);
        return;
      }
      voiceSessionId = data.voice_session_id || data.session_id || voiceSessionId || '';
      if (data.account_id) stickyAccountId = Number(data.account_id) || stickyAccountId || 0;
      if (data.upstream_voice_session_id) upstreamVoiceSessionId = data.upstream_voice_session_id;
      if (data.upstream_conversation_id) conversationId = data.upstream_conversation_id;
      if (data.upstream_parent_message_id) parentMessageId = data.upstream_parent_message_id;
      log('session ok', voiceSessionId, 'account', stickyAccountId, 'resume', !!conversationId);
      schedulePersistUpstreamContext();
      await pc.setRemoteDescription({ type: 'answer', sdp: data.answer_sdp });
      // SDP exchanged: allow hangup, keep status "连接中" until DataChannel opens.
      inCall = true;
      if (isDataChannelReady()) {
        markCallLive('listening', 'statusListening', 'subConnected');
      } else {
        setUIKey('connecting', 'statusConnecting', 'subEntering');
        updateCallControls();
        updateComposerState();
      }
      await ensureRemotePlay();
      setTimeout(onVoiceChannelReady, 700);
    } catch (e) {
      log('start error', String(e));
      setUI('error', t('statusStartFail'), String(e.message || e), 'statusStartFail', '', null, null);
      toast(String(e.message || e));
      await stopCall(false);
    } finally {
      starting = false;
      updateCallControls();
      updateComposerState();
    }
  }

  function clearDisconnectWatch() {
    if (disconnectWatchTimer) {
      clearTimeout(disconnectWatchTimer);
      disconnectWatchTimer = 0;
    }
  }

  function scheduleDisconnectWatch() {
    if (!inCall || stoppingCall || starting) return;
    if (disconnectWatchTimer) return;
    // Give ICE a short window to recover before treating the call as ended.
    disconnectWatchTimer = setTimeout(function () {
      disconnectWatchTimer = 0;
      var state = pc && pc.connectionState;
      var ice = pc && pc.iceConnectionState;
      if (!inCall || stoppingCall) return;
      if (state === 'connected' || ice === 'connected' || ice === 'completed') return;
      endCallFromTransport(state === 'failed' ? 'failed' : 'disconnected');
    }, 1800);
  }

  // Transport-level hangup: release mic/PC/DC and force controls out of live/connecting.
  function endCallFromTransport(reason) {
    if (stoppingCall || (!inCall && !pc && !localStream && !dcChannel)) return;
    clearDisconnectWatch();
    var failed = reason === 'failed';
    stopCall(false).then(function () {
      if (failed) {
        setUIKey('error', 'statusConnFail', 'subNetProxy');
        toast(t('toastConnFail'));
      } else {
        setUIKey('error', 'statusDisconnected', 'subCallEnded');
      }
    }).catch(function () {
      setUIKey('error', failed ? 'statusConnFail' : 'statusDisconnected', failed ? 'subNetProxy' : 'subCallEnded');
    });
  }

  async function stopCall(updateText) {
    if (updateText === undefined) updateText = true;
    if (stoppingCall) return;
    stoppingCall = true;
    clearDisconnectWatch();
    try {
      clearInterval(0);
      if (localRaf) cancelAnimationFrame(localRaf);
      if (remoteRaf) cancelAnimationFrame(remoteRaf);
      localRaf = 0; remoteRaf = 0;
      try { if (dcChannel) dcChannel.close(); } catch (e) {}
      dcChannel = null;
      await stopVoicePreviewOnly();
      if (pc) { try { pc.close(); } catch (e) {} pc = null; }
      if (localStream) {
        localStream.getTracks().forEach(function (t) { t.stop(); });
        localStream = null;
      }
      remoteStream = null;
      disconnectRemotePlaybackGraph();
      remoteAudio.srcObject = null;
      setWaveLevel('local', 0);
      setWaveLevel('remote', 0);
      inCall = false;
      muted = false;
      speakerMuted = false;
      sending = false;
      remoteSpeakingUntil = 0;
      assistantSpeaking = false;
      autoInterruptStartedAt = 0;
      autoInterruptCooldownUntil = 0;
      currentAutoInterruptRms = AUTO_INTERRUPT_RMS;
      currentAutoInterruptHoldMs = AUTO_INTERRUPT_HOLD_MS;
      autoInterruptCalibrationEndsAt = 0;
      autoInterruptCalibrationSamples = [];
      autoInterruptAmbientRms = 0;
      clearInterruptAckWait();
      playbackSuppressed = false;
      streamingCaptionRole = '';
      streamingCaptionText = '';
      streamingCaptionMessageId = '';
      if (remoteAudio) {
        remoteAudio.muted = false;
        remoteAudio.volume = Math.min(1, Math.max(0, playbackVolume));
      }
      // Persist sticky ids, then pull upstream title once if not user-locked.
      // Local title was the first user utterance during the call.
      try { ensureUpstreamIdsForHangup(); } catch (e) {}
      try { await persistUpstreamContextNow(); } catch (e) {}
      try { await fetchAndApplyUpstreamTitle(); } catch (e) {
        log('hangup title fetch fail', String(e && e.message || e));
      }
      // Free the gateway memory binding. Resume uses SQLite call_sessions /
      // local conversation rows on the next dial.
      // "New chat" still clears local ids via createConversationSession().
      try { await releaseBackendVoiceSession(true); } catch (e) {}
      updateCallControls();
      if (updateText) setUIKey('idle', 'statusReady', 'subReady');
      updateTranscriptMeta();
      updateComposerState();
    } finally {
      stoppingCall = false;
    }
  }

  function toggleMute() {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(function (t) { t.enabled = !muted; });
    updateCallControls();
    toast(muted ? t('toastMuted') : t('toastUnmuted'));
  }

  function setSettingsOpen(open) {
    document.body.classList.toggle('settings-open', !!open);
    if (settingsPanel) settingsPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (!open) closeLanguageMenu();
  }

  function setSessionsOpen(open) {
    document.body.classList.toggle('sessions-open', !!open);
    if (!open) closeSessionContextMenu(false);
  }

  function bind() {
    uiLocale = detectUiLocale();
    uiTheme = detectUiTheme();
    applyI18nDom();
    fillVoiceOptions();
    fillLanguageOptions();
    fillInterruptOptions();
    Object.keys(chatgptVoiceMeta).forEach(function (code) {
      chatgptVoiceMeta[code].description = t('voiceDesc_' + code);
    });
    autoInterruptProfiles.conservative.label = t('interruptProfileConservative');
    autoInterruptProfiles.balanced.label = t('interruptProfileBalanced');
    autoInterruptProfiles.sensitive.label = t('interruptProfileSensitive');
    var btnUiLocale = document.getElementById('btnUiLocale');
    var btnUiTheme = document.getElementById('btnUiTheme');
    if (btnUiLocale) {
      btnUiLocale.onclick = function () {
        setUiLocale(uiLocale === 'en' ? 'zh' : 'en', true);
      };
    }
    if (btnUiTheme) {
      btnUiTheme.onclick = function () {
        setUiTheme(uiTheme === 'dark' ? 'light' : 'dark', true);
      };
    }
    if (btnNewSession) btnNewSession.onclick = async function () {
      if (inCall || starting) { toast(t('toastSessionBusy')); return; }
      if (!currentSessionHistory.length && !currentTranscript.length) { setSessionsOpen(false); return; }
      try {
        await createConversationSession();
        setSessionsOpen(false);
      } catch (error) {
        toast(t('conversationSaveFailed') + ': ' + error.message);
      }
    };
    if (sessionList) sessionList.onclick = function (event) {
      var item = event.target.closest('[data-session-id]');
      if (item) activateConversationSession(item.getAttribute('data-session-id'));
    };
    if (sessionList) {
      sessionList.addEventListener('contextmenu', function (event) {
        var item = event.target.closest('[data-session-id]');
        if (!item) return;
        event.preventDefault();
        openSessionContextMenu(item.getAttribute('data-session-id'), event.clientX, event.clientY, item);
      });
      sessionList.addEventListener('keydown', function (event) {
        var item = event.target.closest('[data-session-id]');
        if (!item || !(event.key === 'ContextMenu' || (event.shiftKey && event.key === 'F10'))) return;
        event.preventDefault();
        var rect = item.getBoundingClientRect();
        openSessionContextMenu(item.getAttribute('data-session-id'), rect.left + 12, rect.bottom - 4, item);
      });
      sessionList.addEventListener('scroll', function () { closeSessionContextMenu(false); }, { passive: true });
    }
    if (sessionContextMenu) {
      sessionContextMenu.addEventListener('click', function (event) {
        var action = event.target.closest('[data-session-action]');
        if (action) handleSessionContextAction(action.getAttribute('data-session-action'));
      });
      sessionContextMenu.addEventListener('keydown', function (event) {
        var items = Array.prototype.slice.call(sessionContextMenu.querySelectorAll('[role="menuitem"]'));
        var current = items.indexOf(document.activeElement);
        if (event.key === 'Escape') {
          event.preventDefault();
          closeSessionContextMenu(true);
          return;
        }
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          var delta = event.key === 'ArrowDown' ? 1 : -1;
          var next = current < 0 ? 0 : (current + delta + items.length) % items.length;
          if (items[next]) items[next].focus();
          return;
        }
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (document.activeElement && document.activeElement.getAttribute('data-session-action')) {
            handleSessionContextAction(document.activeElement.getAttribute('data-session-action'));
          }
        }
      });
    }
    document.addEventListener('pointerdown', function (event) {
      if (!sessionContextMenu || sessionContextMenu.hidden || sessionContextMenu.contains(event.target)) return;
      closeSessionContextMenu(false);
    });
    window.addEventListener('resize', function () { closeSessionContextMenu(false); });
    if (renameConversationDialog) renameConversationDialog.addEventListener('close', function () { renameSessionId = ''; });
    if (deleteConversationDialog) deleteConversationDialog.addEventListener('close', function () { deleteSessionId = ''; });
    document.querySelectorAll('[data-dialog-action="cancel"]').forEach(function (button) {
      button.addEventListener('click', function () {
        var dialog = button.closest('dialog');
        if (dialog && dialog.open) dialog.close();
      });
    });
    if (renameConversationForm) renameConversationForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      var id = renameSessionId;
      var title = String(renameConversationInput.value || '').trim();
      if (!title) {
        toast(t('sessionTitleRequired'));
        renameConversationInput.focus();
        return;
      }
      var submit = renameConversationForm.querySelector('button[type="submit"]');
      if (submit) submit.disabled = true;
      try {
        // User rename: persist title_locked=true so hangup never overwrites.
        await renameConversationSession(id, title, true);
        if (id === activeSessionId) {
          titleLocked = true;
          upstreamTitleAppliedFor = conversationId || upstreamTitleAppliedFor;
        }
        renameConversationDialog.close();
        toast(t('sessionRenamed'));
      } catch (error) {
        toast(t('sessionRenameFailed') + ': ' + error.message);
      } finally {
        if (submit) submit.disabled = false;
      }
    });
    if (deleteConversationForm) deleteConversationForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      var id = deleteSessionId;
      var submit = deleteConversationForm.querySelector('button[type="submit"]');
      if (submit) submit.disabled = true;
      try {
        await deleteConversationSession(id);
        deleteConversationDialog.close();
        toast(t('sessionDeleted'));
      } catch (error) {
        toast(t('sessionDeleteFailed') + ': ' + error.message);
      } finally {
        if (submit) submit.disabled = false;
      }
    });
    if (btnOpenSessions) btnOpenSessions.onclick = function () { setSessionsOpen(true); };
    if (btnCloseSessions) btnCloseSessions.onclick = function () { setSessionsOpen(false); };
    if (btnSettings) btnSettings.onclick = function () { setSettingsOpen(true); };
    if (btnCloseSettings) btnCloseSettings.onclick = function () { setSettingsOpen(false); };
    if (settingsBackdrop) settingsBackdrop.onclick = function () { setSettingsOpen(false); };
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      if (languageDropdown && languageDropdown.classList.contains('open')) {
        closeLanguageMenu();
        return;
      }
      setSettingsOpen(false);
      setSessionsOpen(false);
    });
    document.addEventListener('click', function (event) {
      if (!languageDropdown || !languageDropdown.classList.contains('open')) return;
      if (languageDropdown.contains(event.target) || (languageMenu && languageMenu.contains(event.target))) return;
      closeLanguageMenu();
    });
    window.addEventListener('resize', function () {
      if (languageDropdown && languageDropdown.classList.contains('open')) positionLanguageMenu();
    });
    if (settingsPanel) {
      var settingsScroll = settingsPanel.querySelector('.settings-scroll');
      if (settingsScroll) {
        settingsScroll.addEventListener('scroll', function () {
          if (languageDropdown && languageDropdown.classList.contains('open')) positionLanguageMenu();
        }, { passive: true });
      }
    }
    if (languageTrigger) {
      languageTrigger.onclick = function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleLanguageMenu();
      };
    }

    btnMain.onclick = function () {
      if (inCall || starting) stopCall(true);
      else startCall();
    };
    btnMute.onclick = toggleMute;
    btnSpeaker.onclick = toggleSpeaker;
    loadPlaybackVolume();
    if (playbackVolumeEl) {
      var onPlaybackVolumeInput = function () {
        setPlaybackVolume((Number(playbackVolumeEl.value) || 0) / 100, { persist: false, announce: false });
      };
      var onPlaybackVolumeCommit = function () {
        setPlaybackVolume((Number(playbackVolumeEl.value) || 0) / 100, { persist: true, announce: true });
      };
      playbackVolumeEl.addEventListener('input', onPlaybackVolumeInput);
      playbackVolumeEl.addEventListener('change', onPlaybackVolumeCommit);
    }
    interruptSensitivity.onchange = function () {
      beginAutoInterruptCalibration();
      toast(inCall ? t('toastSensitivityInCall') : t('toastSensitivity'));
    };
    btnSend.onclick = sendTextMessage;
    textInput.addEventListener('input', autoResizeComposer);
    textInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTextMessage();
      }
    });
    window.addEventListener('resize', autoResizeComposer);
    autoResizeComposer();
    initWaveBars();
    renderTranscript();
    updateTranscriptMeta();
    window.addEventListener('pagehide', releaseOnPageExit);
    window.addEventListener('beforeunload', releaseOnPageExit);
    btnLogout.onclick = async function () {
      try {
        await stopCall(false);
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin', headers: withCSRFHeaders({}) });
      } finally {
        window.location.replace('/login');
      }
    };
    try {
      var savedVoice = normalizeVoice(localStorage.getItem(voiceStorageKey) || voiceEl.value);
      voiceEl.value = savedVoice;
    } catch (e) {
      voiceEl.value = normalizeVoice(voiceEl.value);
    }
    voiceEl.onchange = function () {
      voiceEl.value = normalizeVoice(voiceEl.value);
      pendingVoicePreview = false;
      try { localStorage.setItem(voiceStorageKey, voiceEl.value); } catch (e) {}
      if (inCall) {
        toast(t('toastPreviewInCall'));
      } else {
        toast(t('toastPreviewIdle'));
      }
      startVoicePreviewOnly(voiceEl.value);
    };
    if (languageEl) {
      var savedLanguage = gatewayVoiceDefaults.language_code;
      try {
        savedLanguage = normalizeLanguage(localStorage.getItem(languageStorageKey) || languageEl.value || gatewayVoiceDefaults.language_code);
      } catch (e) {
        savedLanguage = normalizeLanguage(languageEl.value || gatewayVoiceDefaults.language_code);
      }
      setLanguageValue(savedLanguage, false);
    }
    setUIKey('idle', 'statusReady', 'subReady');
    updateComposerState();
    initializeConversationStore().catch(function () {});
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      navigator.mediaDevices.enumerateDevices().then(refreshMics).catch(function () {});
    }
    setTimeout(warmMicPermission, 600);
  }

  try {
    bind();
    loadGatewayVoiceConfig().catch(function () {});
  }
  catch (e) {
    statusText.textContent = t('statusPageError');
    subText.textContent = String(e);
  }
})();
</script>
</body>
</html>
